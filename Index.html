<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me?</title>
    <style>
        /* --- ОБЩИЕ СТИЛИ --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* --- ЭКРАН 1: ОКОШКО --- */
        #window-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .popup {
            position: absolute;
            background-color: #000;
            border: 2px solid #fff;
            box-shadow: 4px 4px 0px rgba(255, 255, 255, 0.5);
            padding: 20px;
            width: 320px;
            text-align: center;
            color: #fff;
        }

        .popup-header {
            display: flex;
            gap: 6px;
            margin-bottom: 25px;
            position: absolute;
            top: 10px;
            left: 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border: 1px solid #fff;
            background: transparent;
        }

        .popup-text {
            font-size: 20px;
            margin-top: 10px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .btn-container {
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
        }

        .btn {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 8px 20px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        /* --- ЭКРАН 2: LOVE YOU --- */
        #love-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-color: #050005;
            overflow: hidden;
            z-index: 10;
        }

        /* Контейнер для колонок с текстом */
        .columns-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.4; /* Приглушенный фон, чтобы центр выделялся */
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            white-space: nowrap;
            /* ВАЖНО: высота колонки должна быть больше экрана */
            height: 200%; 
        }

        .column-text {
            color: #ff1493; /* Розовый цвет */
            font-size: 24px;
            font-weight: bold;
            line-height: 1.5;
            text-shadow: 0 0 5px #ff1493;
            /* Текст внутри колонки тоже должен быть длинным */
        }

        /* Анимации движения вниз (разная скорость) */
        .col-1 { animation: scrollDown 4s linear infinite; }
        .col-2 { animation: scrollDown 7s linear infinite; }
        .col-3 { animation: scrollDown 3s linear infinite; }
        .col-4 { animation: scrollDown 8s linear infinite; }
        .col-5 { animation: scrollDown 5s linear infinite; }

        @keyframes scrollDown {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0%); }
        }

        /* Центральный контент (Love You + Сердце) */
        .center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            text-align: center;
        }

        .main-love-text {
            color: #fff;
            font-size: 60px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 60px; /* Отступ, чтобы сердечко было ниже */
            text-shadow: 0 0 15px #fff, 0 0 30px #ff1493;
        }

        /* Контейнер для сердечка (отвечает за общее свечение) */
        .heart-container {
            width: 80px;
            height: 80px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Свечение применяется ко всей фигуре целиком */
            filter: drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #ff1493);
        }

        /* Само сердечко (белый квадрат + два круга) */
        .heart {
            width: 80px;
            height: 80px;
            background-color: #fff;
            position: relative;
            transform: rotate(-45deg);
        }

        .heart::before,
        .heart::after {
            content: '';
            width: 80px;
            height: 80px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before {
            top: -40px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 40px;
        }
    </style>
</head>
<body>

    <!-- Экран 1: Стартовое окно -->
    <div id="window-container">
        <!-- Окна добавляются через JS -->
    </div>

    <!-- Экран 2: Love You -->
    <div id="love-screen">
        <div class="columns-container" id="columns-container">
            <!-- Колонки генерируются через JS -->
        </div>
        
        <div class="center-content">
            <div class="main-love-text">LOVE YOU</div>
            <div class="heart-container">
                <div class="heart"></div>
            </div>
        </div>
    </div>

    <script>
        // --- ЛОГИКА ДЛЯ СТАРТОВОГО ЭКРАНА ---
        const windowContainer = document.getElementById('window-container');
        const loveScreen = document.getElementById('love-screen');
        let windowCount = 0;

        function createPopup() {
            const popup = document.createElement('div');
            popup.className = 'popup';
            
            // Случайное смещение окна
            const maxOffset = 100; 
            const randomX = (Math.random() - 0.5) * maxOffset;
            const randomY = (Math.random() - 0.5) * maxOffset;
            
            popup.style.left = `calc(50% + ${randomX}px)`;
            popup.style.top = `calc(50% + ${randomY}px)`;
            popup.style.transform = 'translate(-50%, -50%)';
            popup.style.zIndex = windowCount;

            popup.innerHTML = `
                <div class="popup-header">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="popup-text">Do you love me?</div>
                <div class="btn-container">
                    <button class="btn btn-yes">Yes</button>
                    <button class="btn btn-no">No</button>
                </div>
            `;

            const btnYes = popup.querySelector('.btn-yes');
            const btnNo = popup.querySelector('.btn-no');

            // Нажатие "Yes"
            btnYes.addEventListener('click', () => {
                windowContainer.style.display = 'none';
                loveScreen.style.display = 'block';
                generateColumns();
            });

            // Нажатие "No"
            btnNo.addEventListener('click', () => {
                windowCount++;
                createPopup();
            });

            windowContainer.appendChild(popup);
        }

        // Создаем первое окно
        createPopup();


        // --- ЛОГИКА ДЛЯ ЭКРАНА LOVE YOU ---
        function generateColumns() {
            const container = document.getElementById('columns-container');
            container.innerHTML = '';
            const numCols = 8; 

            // Генерируем длинный текст (чтобы анимация не заканчивалась)
            // 20 повторов должно хватить с головой
            let longText = '';
            for (let k = 0; k < 20; k++) {
                longText += 'YOULOVEYOU<br>LOVEYOULOVE<br>';
            }

            for (let i = 0; i < numCols; i++) {
                const col = document.createElement('div');
                col.className = 'column';
                
                // Чередуем скорости: 1, 2, 3, 4, 5, 1, 2, 3...
                const animClass = `col-${(i % 5) + 1}`;
                col.classList.add(animClass);

                const textDiv = document.createElement('div');
                textDiv.className = 'column-text';
                
                // Вставляем текст, дублируя его для эффекта бесконечности
                textDiv.innerHTML = longText + longText;

                col.appendChild(textDiv);
                container.appendChild(col);
            }
        }
    </script>
</body>
</html>
